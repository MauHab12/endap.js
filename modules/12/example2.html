<body>
<!-- code begins -->

<script src="../../libs/chartjs/4.5.1/chart.umd.min.js" defer></script>

<script type="importmap">
{
  "imports": {
    "endap": "../../libs/endap/0.0.4/endap.min.js"
  }
}
</script>


<div id="cnt">
</div>

<script type=module>
   // Create textarea
    const textarea = document.createElement("textarea");
    textarea.rows = 10;
    textarea.cols = 30;
    textarea.placeholder = "Generated numbers will appear here...";
    cnt.appendChild(textarea);

    // Create Generate button
    const generateBtn = document.createElement("button");
    generateBtn.textContent = "generate";
    cnt.appendChild(generateBtn);

    // Create Clear button
    const clearBtn = document.createElement("button");
    clearBtn.textContent = "clear";
    cnt.appendChild(clearBtn);

    // Generate 100 random two-digit numbers
    generateBtn.addEventListener("click", () => {
        const numbers = [];

        for (let i = 0; i < 100; i++) {
            const randomNumber = Math.floor(Math.random() * 100);
            numbers.push(String(randomNumber).padStart(2, "0"));
        }

        textarea.value = numbers.join(", ");
    });

    // Clear textarea
    clearBtn.addEventListener("click", () => {
        textarea.value = "";
    });
</script>
